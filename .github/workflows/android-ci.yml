name: Android CI

on:
  push:
    branches:
      - main
      - cursor/**
  pull_request:
    branches:
      - main

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Android build
        uses: ./.github/actions/setup-android

      - name: Check release tag parser
        run: bash scripts/release-version.sh --self-test

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify stable debug signing cert
        run: |
          CERT="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk)"
          echo "$CERT"
          echo "$CERT" | grep -qi 'CN=Boomeranger Debug'
          echo "$CERT" | grep -qi 'ace59ad6d965e339fb7f290b3e931e6d71f35835d434f5893414f3e15cd16739'

      - name: Assemble release APK smoke
        run: |
          eval "$(bash scripts/release-version.sh v1.0.0)"
          ./gradlew :app:assembleRelease --stacktrace \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")"
          echo "$CERT"
          echo "$CERT" | grep -qi 'CN=Boomeranger Debug'
          echo "$CERT" | grep -qi 'ace59ad6d965e339fb7f290b3e931e6d71f35835d434f5893414f3e15cd16739'
          if [[ -x "$BUILD_TOOLS/aapt" ]]; then
            BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          else
            BADGING="$("$BUILD_TOOLS/aapt2" dump badging "$APK")"
          fi
          echo "$BADGING" | head -n 5
          echo "$BADGING" | grep -q "versionCode='1000000'"
          echo "$BADGING" | grep -q "versionName='1.0.0'"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: boomeranger-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
